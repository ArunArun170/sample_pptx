name: Daily Birthday Poster Automation

on:
  schedule:
    # 18:30 UTC = 12:00 AM IST (தினமும் நள்ளிரவு 12:00 மணி)
    - cron: '30 18 * * *'
  workflow_dispatch: # மேனுவலாக டெஸ்ட் செய்து பார்க்க உதவும் பட்டன்

jobs:
  run-birthday-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/checkout@v3
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl python-pptx requests

      - name: Execute Birthday Bot Script
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          TARGET_WHATSAPP_NUMBER: ${{ secrets.TARGET_WHATSAPP_NUMBER }}
        run: python birthday_bot.py
